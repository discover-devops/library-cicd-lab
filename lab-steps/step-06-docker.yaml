name: Library API - End to End CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  EKS_CLUSTER: discover-eks
  IMAGE_NAME: library-api

jobs:
  compile:
    name: Compile
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin
      - name: Compile with Maven
        run: mvn -B -ntp compile

  security-scan:
    name: Security scan (secrets and dependencies)
    runs-on: self-hosted
    needs: compile
    steps:
      - name: Checkout code (full history for secret scanning)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin

      - name: Download Maven dependencies (Trivy reads them from the local cache)
        run: mvn -B -ntp dependency:resolve

      - name: Gitleaks secret scan
        run: gitleaks detect --source . --redact --verbose --report-format json --report-path gitleaks-report.json

      - name: Trivy filesystem scan (report only)
        run: |
          trivy fs --format json --output trivy-fs-report.json .
          trivy fs --severity HIGH,CRITICAL --exit-code 0 .

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-reports
          path: |
            gitleaks-report.json
            trivy-fs-report.json
          if-no-files-found: ignore

  test:
    name: Unit tests and coverage
    runs-on: self-hosted
    needs: security-scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin
      - name: Run unit tests
        run: mvn -B -ntp test

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-and-coverage-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
          if-no-files-found: warn

  quality-and-package:
    name: Package, SonarQube analysis and quality gate
    runs-on: self-hosted
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin
      - name: Package the application (tests run again here to produce coverage for Sonar)
        run: mvn -B -ntp package

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-jar
          path: target/library-api.jar
          if-no-files-found: error

      - name: SonarQube analysis and quality gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        run: |
          mvn -B -ntp org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=library-api \
            -Dsonar.projectName="Library API" \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.qualitygate.wait=true

  docker-build-scan-push:
    name: Build image, scan it, push to Docker Hub
    runs-on: self-hosted
    needs: quality-and-package
    env:
      IMAGE: ${{ vars.DOCKER_HUB_USERNAME }}/library-api
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download JAR artifact
        uses: actions/download-artifact@v8
        with:
          name: app-jar
          path: target/

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .

      - name: Trivy image scan (fails the job on CRITICAL findings)
        run: trivy image --severity CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE:${{ github.sha }}"

      - name: Push image to Docker Hub
        run: docker push --all-tags "$IMAGE"
