name: Library API - End to End CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  EKS_CLUSTER: discover-eks
  IMAGE_NAME: library-api

jobs:
  compile:
    name: Compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin
      - name: Compile with Maven
        run: mvn -B -ntp compile

  security-scan:
    name: Security scan (secrets and dependencies)
    runs-on: ubuntu-latest
    needs: compile
    steps:
      - name: Checkout code (full history for secret scanning)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Download Maven dependencies (Trivy reads them from the local cache)
        run: mvn -B -ntp dependency:resolve

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Install Gitleaks
        run: |
          curl -sSL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          sudo tar -xzf gitleaks.tgz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Gitleaks secret scan
        run: gitleaks detect --source . --redact --verbose --report-format json --report-path gitleaks-report.json

      - name: Trivy filesystem scan (report only)
        run: |
          trivy fs --format json --output trivy-fs-report.json .
          trivy fs --severity HIGH,CRITICAL --exit-code 0 .

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-reports
          path: |
            gitleaks-report.json
            trivy-fs-report.json
          if-no-files-found: ignore
